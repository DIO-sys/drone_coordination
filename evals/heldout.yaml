# Hand-written held-out evaluation set (Phase 5).
#
# Rule 4: these instructions are written by hand and NEVER passed through the
# back-translation phrase banks in planguard/copilot/dataset_gen.py. Scores on
# this file are reported in their own column and must never be averaged with
# the in-distribution test split.
#
# Authoring rules, so the set stays scoreable:
#   * every instruction must contain enough to reconstruct its plan exactly --
#     budget, dwell, aircraft counts, link needs, ordering, fallbacks
#   * requires_link is impossible on north_ridge: it reaches 8051 m from base
#     and the link range is 7500 m, so the validator rejects it
#   * station_keep needs dwell_s; return_to_rally needs rally_point; any task
#     with requires_link needs a link_lost fallback
#   * the budget must exceed the makespan lower bound, which tests/ checks
#
# Reference durations at 4 aircraft, 30 m/s (one aircraft unless noted):
#   sweep north_ridge   865 s (2ac 531, 3ac 420)   sweep east_sector  417 s (2ac 306)
#   sweep south_valley  357 s (2ac 190)            patrol river       193 s (2ac 142)
#   patrol highway      258 s (2ac 208)            station bridge     172 s + dwell
#   station rally_alpha  27 s + dwell              station relay_hill 139 s + dwell
#   station rally_bravo 145 s + dwell              rally <any point>  travel only
#
# register: radio | formal | chatty | bulleted | terse

items:
  # ----------------------------------------------------------------- radio ---
  - id: h001
    register: radio
    notes: clipped, no articles, abbreviated units
    instruction: >-
      Sweep south valley, single ship. 15 min hard stop.
    plan:
      name: south valley sweep
      time_budget_s: 900
      tasks:
        - id: sweep_south
          kind: sweep
          target: south_valley

  - id: h002
    register: radio
    notes: two-digit minute figure, aircraft count as a numeral
    instruction: >-
      Need 2 ships on north ridge for coverage. Window is 20 min.
