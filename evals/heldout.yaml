      time_budget_s: 1200
      tasks:
        - id: ridge
          kind: sweep
          target: north_ridge
          aircraft_count: 2

  - id: h003
    register: radio
    notes: comms requirement stated as jargon; rally by callsign
    instruction: >-
      Overwatch on the bridge, 10 min on station. Comms must stay up. Link
      goes down, RTB to rally alpha. 25 min total.
