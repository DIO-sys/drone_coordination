      name: bridge overwatch
      time_budget_s: 1500
      tasks:
        - id: bridge_watch
          kind: station_keep
          target: bridge
          dwell_s: 600
          requires_link: true
      fallbacks:
        - trigger: link_lost
          action: return_to_rally
          rally_point: rally_alpha

  - id: h004
    register: radio
    notes: sequencing by "then", no explicit dependency language
